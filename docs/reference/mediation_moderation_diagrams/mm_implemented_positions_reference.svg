<rect class="bg" width="100%" height="100%"/>
<text class="title" x="58" y="48">매개·조절 결과 모형도 위치 기준</text>
<text class="lead" x="58" y="78">현재 구현 좌표를 B5 포트레이트형 패널에 매핑한 참고 그림입니다. 숫자는 패널 기준 퍼센트 좌표입니다.</text><g><rect class="panel" x="58" y="135" width="520" height="292" rx="10"/><text class="panel-title" x="58" y="104">1. 단일 X - 단일 매개</text><text class="panel-subtitle" x="58" y="124">Model 4/5 기본: X, M, Y는 기존 모형 그림과 동일</text><line x1="141.2" y1="304.4" x2="318.0" y2="257.6" class="edge" marker-end="url(#arrow)"/><line x1="318.0" y1="257.6" x2="494.8" y2="304.4" class="edge" marker-end="url(#arrow)"/><line x1="141.2" y1="304.4" x2="494.8" y2="304.4" class="edge" marker-end="url(#arrow)"/><g class="node " transform="translate(141.2 304.4)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">X</text></g><g class="node " transform="translate(318.0 257.6)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">M</text></g><g class="node " transform="translate(494.8 304.4)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">Y</text></g><text class="coord" x="141.2" y="336.4" text-anchor="middle">16,58</text><text class="coord" x="318.0" y="230.6" text-anchor="middle">50,42</text><text class="coord" x="494.8" y="336.4" text-anchor="middle">84,58</text></g><g><rect class="panel" x="624" y="135" width="520" height="292" rx="10"/><text class="panel-title" x="624" y="104">2. 단일 X - 조절</text><text class="panel-subtitle" x="624" y="124">Model 1: W는 X와 Y 위 중앙</text><line x1="707.2" y1="330.6" x2="1060.8" y2="330.6" class="edge" marker-end="url(#arrow)"/><line x1="884.0" y1="234.3" x2="884.0" y2="330.6" class="edge" marker-end="url(#arrow)"/><g class="node " transform="translate(707.2 330.6)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">X</text></g><g class="node w" transform="translate(884.0 234.3)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">W</text></g><g class="node " transform="translate(1060.8 330.6)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">Y</text></g><text class="coord" x="707.2" y="362.6" text-anchor="middle">16,67</text><text class="coord" x="884.0" y="207.3" text-anchor="middle">50,34</text><text class="coord" x="1060.8" y="362.6" text-anchor="middle">84,67</text></g><g><rect class="panel" x="58" y="497" width="520" height="292" rx="10"/><text class="panel-title" x="58" y="466">3. 다중 X - 매개 없음</text><text class="panel-subtitle" x="58" y="486">X는 16열, Y는 84열, W는 50열 상단</text><line x1="141.2" y1="555.4" x2="494.8" y2="666.4" class="edge" marker-end="url(#arrow)"/><line x1="141.2" y1="625.5" x2="494.8" y2="666.4" class="edge" marker-end="url(#arrow)"/><line x1="141.2" y1="695.6" x2="494.8" y2="666.4" class="edge" marker-end="url(#arrow)"/><line x1="141.2" y1="754.0" x2="494.8" y2="666.4" class="edge" marker-end="url(#arrow)"/><line x1="318.0" y1="526.2" x2="318.0" y2="666.4" class="edge" marker-end="url(#arrow)"/><g class="node " transform="translate(141.2 555.4)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">X1</text></g><g class="node " transform="translate(141.2 625.5)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">X2</text></g><g class="node " transform="translate(141.2 695.6)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">X3</text></g><g class="node " transform="translate(141.2 754.0)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">X4</text></g><g class="node w" transform="translate(318.0 526.2)"><rect x="-44" y="-15" width="88" height="30" rx="5"/><text text-anchor="middle" dominant-baseline="middle">W</text></g><g class="node " transform="translate